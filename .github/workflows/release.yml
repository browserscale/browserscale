name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # npm trusted publishing: the registry accepts this run's OIDC identity in
  # place of a token, and signs provenance against it.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from history, so a shallow clone
          # is not enough.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Builds every target and uploads the GitHub release. `go install` needs
      # none of this.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage npm packages
        run: node scripts/build-npm.mjs --version "${GITHUB_REF_NAME#v}" --dist dist --out dist/npm

      # Publishing uses npm trusted publishing (OIDC), never a stored token.
      # A trusted publisher can only be attached to a package that already
      # exists, so the first release of each package is published by hand and
      # this stays off until every package trusts this workflow. Turn it on
      # with the repository variable NPM_TRUSTED_PUBLISHING=true.
      #
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships older.
      - name: Update npm
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: npm install -g npm@latest

      # Platform packages go first: the wrapper pins them exactly, so
      # publishing it first would leave a window where installs fail. A version
      # that is already on the registry is skipped, so a rerun, or a release
      # whose packages were published by hand, finishes instead of failing.
      - name: Publish npm packages
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: |
          set -euo pipefail
          publish() {
            name="$(node -p "require('./$1/package.json').name")"
            version="$(node -p "require('./$1/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              return
            fi
            npm publish "$1" --access public --provenance
          }
          for pkg in dist/npm/@browserscale/*; do
            publish "$pkg"
          done
          publish dist/npm/browserscale
