name: release

# The programs are built elsewhere and arrive here as a release's assets. This
# workflow only turns them into npm packages and publishes them, from this
# repository: npm's trusted publishers are bound to it and to this file's
# name, and package.json's repository.url has to match it. A stable release
# also moves the Homebrew formula in browserscale/homebrew-tap to it, and
# every release brings the versions in README.md up to date.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to npm and Homebrew, e.g. v0.4.0"
        required: true

permissions:
  contents: read
  # npm trusted publishing: the registry accepts this run's OIDC identity in
  # place of a token, and signs provenance against it.
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs Node 22.14 or newer and npm 11.5.1 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # The archives for macOS and Linux and, for Windows, the two programs.
      - name: Download the release's programs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern 'browserscale-studio_*.tar.gz' --pattern 'browserscale-studio_*_windows_*.exe' \
            --pattern 'browserscale-cli_*_windows_*.exe' --pattern 'checksums.txt'
          cd assets
          sha256sum --check --ignore-missing checksums.txt

      # The wrapper ships README.md, and npm shows a version's README for good.
      # The checkout is the tag, whose README still names the release before
      # this one; the readme job only updates main once this one is out.
      - name: Write the versions into the packaged README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 200 --json tagName,publishedAt > "$RUNNER_TEMP/releases.json"
          node scripts/update-readme.mjs --releases "$RUNNER_TEMP/releases.json" --readme README.md

      - name: Stage npm packages
        run: node scripts/build-npm.mjs --version "${TAG#v}" --assets assets --out dist/npm

      # Installing them is the check: the wrapper finds its binary through
      # require.resolve, which is the first thing a user meets. Tarballs, not
      # directories: npm links a directory install, and the launcher then
      # resolves from the source tree.
      - name: Install the staged packages and run the command
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm pack "$GITHUB_WORKSPACE/dist/npm/@browserscale/linux-x64"
          npm pack "$GITHUB_WORKSPACE/dist/npm/browserscale"
          npm install -g ./*.tgz
          browserscale version
          browserscale help >/dev/null

      - name: Update npm
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: npm install -g npm@latest

      # Platform packages go first: the wrapper pins them exactly, so
      # publishing it first would leave a window where installs fail. A version
      # already on the registry is skipped, so a rerun finishes instead of
      # failing. A prerelease goes to the "next" tag, so `npm i -g browserscale`
      # keeps installing the latest stable one.
      - name: Publish npm packages
        if: vars.NPM_TRUSTED_PUBLISHING == 'true'
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          publish() {
            name="$(node -p "require('./$1/package.json').name")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              return
            fi
            npm publish "$1" --access public --tag "$tag"
          }
          for pkg in dist/npm/@browserscale/*; do
            publish "$pkg"
          done
          publish dist/npm/browserscale

  # Homebrew has no channel like npm's "next", so a prerelease leaves the
  # formula where it is. Without RELEASE_APP_ID the job is skipped.
  homebrew:
    if: ${{ !contains(github.event.release.tag_name || inputs.tag, '-') && vars.RELEASE_APP_ID != '' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --pattern checksums.txt

      # The release app, installed on homebrew-tap with contents: write. This
      # workflow's own token only reaches this repository.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: browserscale
          repositories: homebrew-tap

      - uses: actions/checkout@v4
        with:
          repository: browserscale/homebrew-tap
          token: ${{ steps.app.outputs.token }}
          path: tap

      - name: Write the formula
        run: |
          set -euo pipefail
          node scripts/build-formula.mjs --version "$TAG" --checksums assets/checksums.txt --out tap/Formula/browserscale.rb
          ruby -c tap/Formula/browserscale.rb

      # A rerun with the formula already at this release changes nothing.
      - name: Push to the tap
        working-directory: tap
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formula/browserscale.rb is already at ${TAG#v}"
            exit 0
          fi
          id="$(gh api "/users/${APP}[bot]" --jq .id)"
          git config user.name "${APP}[bot]"
          git config user.email "${id}+${APP}[bot]@users.noreply.github.com"
          git commit -qam "browserscale ${TAG#v}"
          git push

  # The versions block in README.md: the newest stable release, and the newest
  # prerelease while it is ahead of it. Drafts never show, since only
  # publishing one starts this workflow. One run at a time, each from the
  # newest main, so two releases close together don't push over each other.
  readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: readme
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Write the versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 200 --json tagName,publishedAt > "$RUNNER_TEMP/releases.json"
          node scripts/update-readme.mjs --releases "$RUNNER_TEMP/releases.json" --readme README.md

      - name: Push to main
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "README.md is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "README: browserscale studio ${TAG#v}"
          git push origin HEAD:main
