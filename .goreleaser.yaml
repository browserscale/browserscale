# Release pipeline for the install channels. `go install` needs nothing
# from this file; npm consumes the binaries built here.
#
# Local dry run (no tag, no upload, nothing published):
#   goreleaser release --snapshot --clean
version: 2

project_name: browserscale

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: browserscale
    main: .
    binary: browserscale
    env:
      # A static binary keeps the Linux archives working on musl (Alpine) as
      # well as glibc, which matters because npm ships one artifact per arch.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/browserscale/browserscale/internal/cli.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: browserscale
    ids:
      - browserscale
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  footer: |
    ## Install

    ```bash
    npm i -g browserscale    # any platform with Node
    go install github.com/browserscale/browserscale@{{ .Tag }}
    ```
